[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM10
monitor_port = COM10
build_unflags = -std=gnu++11
; Arduino calls setup() and loop() by their global names; Kira puts them in namespace app, so the linker aliases them.
build_flags = -std=gnu++20 -Ilib -Wl,--defsym,_Z5setupv=_ZN3app5setupEv -Wl,--defsym,_Z4loopv=_ZN3app4loopEv
lib_deps = Wire, WiFi, EEPROM
board_build.partitions = huge_app.csv
